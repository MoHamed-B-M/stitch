name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release APK build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # Uses the SDK preinstalled on GitHub runners. android-actions/setup-android@v3
        # is avoided on purpose: it still tries to install the removed "tools" package.
        run: |
          set -uo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found at $SDK"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager: $SDKMANAGER"
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            if ! "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null; then
              echo "::warning::sdkmanager install reported an error; relying on preinstalled components"
            fi
          else
            echo "::warning::sdkmanager not found; relying on preinstalled SDK components"
          fi
          echo "--- platforms ---"; ls "$SDK/platforms" 2>/dev/null || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode release keystore
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_B64 is missing - cannot build a signed release."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > keystore/release.jks
          test -s keystore/release.jks

      - name: Compute release version
        if: github.event_name == 'push' && github.ref_name == 'main'
        id: version
        run: |
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '[.[] | select(.prerelease == false and .draft == false)][0].tag_name // ""')
          if [ -z "$LATEST" ]; then
            TAG="v1.0.0"
          else
            RAW="${LATEST#v}"
            MAJOR="${RAW%%.*}"
            REST="${RAW#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            PATCH="${PATCH%%[!0-9]*}"
            case "$MAJOR$MINOR$PATCH" in
              *[!0-9]*)
                echo "::error::Latest release tag '$LATEST' is not semver; refusing to guess the next version."
                exit 1
                ;;
            esac
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          NAME="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Next release: ${TAG}"

      - name: Build release APK
        env:
          APP_VERSION_NAME: ${{ github.event_name == 'push' && github.ref_name == 'main' && steps.version.outputs.name || format('0.0.0-{0}', github.run_number) }}
          APP_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_B64: ${{ github.event_name == 'push' && github.ref_name == 'main' && secrets.ANDROID_KEYSTORE_B64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && github.ref_name == 'main' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name == 'push' && github.ref_name == 'main' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name == 'push' && github.ref_name == 'main' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature
        if: github.event_name == 'push' && github.ref_name == 'main'
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"
          echo "path=${APK}" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        if: github.event_name != 'push' || github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish full release
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          APK: ${{ steps.apk.outputs.path }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Stitch Authenticator v${NAME}" \
            --generate-notes

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
